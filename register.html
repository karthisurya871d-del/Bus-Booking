<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Bus Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="logo">
        RedBus
    </div>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>
</header>
<div class="form-container">
    <h2>Create Account</h2>
    <form onsubmit="registerUser(event)">
        <div class="input-box">
            <label for="name">
                Full Name
            </label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >
        </div>
        <div class="input-box">
            <label for="email">
                Email
            </label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >
        </div>
        <div class="input-box">
            <label for="phone">
                phone Number
            </label>
            <input
                type="tel"
                id="phone"
                placeholder="Enter phone number"
                pattern="[0-9]{10}"
                maxlength="10"
                required
            >
        </div>
        <div class="input-box">
            <label for="password">
                Password
            </label>
            <input
                type="password"
                id="password"
                placeholder="Create password"
                minlength="6"
                required
            >
        </div>
        <div class="input-box">
            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                minlength="6"
                required
            >
        </div>
        <button type="submit">
            Register
        </button>
    </form>
    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>
</div>
<script src="script.js"></script>
</body>
</html>
